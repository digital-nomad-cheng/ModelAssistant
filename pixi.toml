[project]
authors = ["digital-nomad-cheng <vincentcheng929@gmail.com>"]
channels = ["conda-forge"]
name = "sscma-pixi"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]

[feature.base.dependencies]
numpy = ">=1.23.0,<2.0.0"
opencv = ">=4.9.0"
albumentations = "<=1.3.1"
libusb1 = "*"
cbor = "*"
openmim = ">=0.3.7"
packaging = ">=23.1"
pandas = ">=2.0.0"
pillow = ">=9.4.0"
pyyaml = ">=6.0"
scikit-image = ">=0.20.0"
scikit-learn = ">=1.2.2"
libsndfile = ">=0.12.1"
tensorboard = ">=2.12.3"
tqdm = ">=4.65.0"

# data
# Note: pyvww might need to be installed via pip if not available in conda-forge

[feature.base.pypi-dependencies]
# Dependencies that are only available via PyPI
pyvww = "*"
soundfile = ">=0.12.1"

[environments]
default = ["base"]
